[pytest]
# The `slow` marker is registered in tests/conftest.py.  Slow tests are
# deselected by default so that `python3 -m pytest tests -q` stays quick;
# run them with `-m slow`, or run everything with `-m ""`.
addopts = -m "not slow"
# Q19 (wrap-up review, 2026-10-26): bare `pytest` from the repository root used
# to collect simulators/gem5/tests and abort on 63 collection errors.
testpaths = tests

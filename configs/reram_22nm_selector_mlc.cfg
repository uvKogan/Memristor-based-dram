# Architectural configuration for 128MB Selector-based Module

-DesignTarget: RAM            # Ensures SLC operation and avoids NAND error

-OptimizationTarget: ReadLatency

-ProcessNode: 22

-Capacity (MB): 128
-ForceMat: 1x2                # MLC uses half the physical mats for same capacity.
-WordWidth (bit): 64

#-DeviceRoadmap: LOP
-DeviceRoadmap: HP

-LocalWireType: LocalAggressive 
-GlobalWireType: GlobalAggressive

-Routing: H-tree
-InternalSensing: false       # External sensing to save area (standard for 1S1R)

-MemoryCellInputFile: reram_22nm_selector.cell

-Temperature (K): 300

# MLC Structural Trick: Halve physical mats to show density gain
-ForceBank (Total AxB, Active CxD): 1x1, 1x1
-ForceMat (Total AxB, Active CxD): 1x2, 1x2
-ForceMuxSenseAmp: 32
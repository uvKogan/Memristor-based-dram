# Architectural configuration for 128MB 1T1R Module

-DesignTarget: RAM            # Forces SLC RAM mode to avoid MLC NAND errors
# -DesignTarget: Random Access Memory            # Forces SLC RAM mode to avoid MLC NAND errors

-OptimizationTarget: ReadLatency # Simulator will optimize hierarchy for speed

-ProcessNode: 22

-Capacity (MB): 128
-ForceMuxSenseAmp: 16
-WordWidth (bit): 64          # Standard 64-bit CPU interface

-SubarrayRow: 512
-SubarrayColumn: 512
-MuxSenseAmp: 16
-MuxOutputLev1: 1
-MuxOutputLev2: 4

#-DeviceRoadmap: LOP           # Low Operating Power (logic-compatible)
-DeviceRoadmap: HP

-LocalWireType: LocalAggressive 
-GlobalWireType: GlobalAggressive

-Routing: H-tree              # Hierarchical routing for uniform latency
-InternalSensing: true        # SAs located in subarrays for fast timing

-MemoryCellInputFile: reram_22nm_1t1r_slc.cell

-Temperature (K): 300         # Standard ambient operating temperature
# Architectural configuration for 128MB Selector-based Module

-DesignTarget: RAM            # Ensures SLC operation and avoids NAND error

-OptimizationTarget: ReadLatency

-ProcessNode: 22

-Capacity (MB): 128
-WordWidth (bit): 64

-SubarrayRow: 128
-SubarrayColumn: 128
-MuxSenseAmp: 4
-MuxOutputLev1: 1
-MuxOutputLev2: 4

#-DeviceRoadmap: LOP
-DeviceRoadmap: HP

-LocalWireType: LocalAggressive 
-GlobalWireType: GlobalAggressive

-Routing: H-tree
-InternalSensing: true       # External sensing to save area (standard for 1S1R)

-MemoryCellInputFile: reram_22nm_selector_slc.cell

-Temperature (K): 300